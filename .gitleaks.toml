# .gitleaks.toml — secret scan config for `make secrets`.
#
# GitHub's own secret scanning + push protection are enabled on this repo and
# cover pushes. They do NOT cover the commit you are about to make on your own
# machine, which is the one moment a key is cheap to remove — hence a local pass.
#
# Scoped to the repo-owned tree: core/ is vendored and scanned by its own CI, so
# including it here would just report the same finding in nine repos at once.
[extend]
useDefault = true

[[allowlists]]
description = "Vendored Core — gated upstream in dotfiles-core, not fixable here"
paths = ['''^core/''']

[[allowlists]]
description = """
Documentation that deliberately shows the SHAPE of a secret. These are
placeholders and templates, not values: the README carries a base64 data: URI for a
badge logo, which the default entropy rules read as a high-entropy blob.

The ssh/config entry that used to sit here is gone with the file — the client config
moved into Core (dotgibson/dotfiles-core#450) and is scanned there. .gitignore now
ignores ssh/ entirely, so nothing under it is tracked to allowlist.
"""
paths = [
  '''^README\.md$''',
]
