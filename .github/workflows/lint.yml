name: lint

# Thin caller for the reusable shell/actionlint gate authored in dotfiles-core
# (.github/workflows/lint-call.yml) — one definition for the whole fleet, replacing the
# ~200-line copy this file used to carry. The gate's internals (the SHA-256-verified
# pinned-tool bootstrap, the core/ exclude, shfmt-advisory) live there now. This repo has no
# extra excludes (only Offense does), so no `with:` is needed.
# NO `paths-ignore`, deliberately. A required status check that does not run is not
# "skipped" to a ruleset — it stays PENDING and blocks the PR forever, so a gate with
# a path filter cannot be a required check at all. This is the most valuable gate in
# the repo to require (shellcheck + bash -n + zsh -n over every repo-owned file), and
# the cost of dropping the filter is running it on a docs-only PR, where it finishes
# in seconds because the file list is unchanged.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: dotgibson/dotfiles-core/.github/workflows/lint-call.yml@v5
