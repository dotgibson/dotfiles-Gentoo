# .github/workflows/bootstrap.yml
# Thin caller for the reusable bootstrap test authored in dotfiles-core. The logic
# lives there (one place for the whole fleet); this just names Gentoo's container +
# a prep step. See dotfiles-core/.github/workflows/bootstrap-test.yml.
#
# prep does NOT install zsh — on Gentoo that's an emerge source-compile (minutes);
# the stage3 image already ships bash, and with no zsh blib_set_login_shell takes its
# graceful early-return, which --links-only is fine with. prep's one job here is to
# guarantee the CI fixture satisfies bootstrap.sh's `ID=gentoo` sanity check: the
# stage3 image's /etc/os-release doesn't always carry that line, so we ensure it
# (a real Gentoo box always has it — this only patches the throwaway container).
#
# It appends the value QUOTED — ID='gentoo' — because that is what a real Gentoo box
# ships (os-release(5) permits shell quoting, and Gentoo uses it). The previous prep
# wrote it BARE, which manufactured the one spelling the old `grep -qiE '^ID=gentoo'`
# check in bootstrap.sh accepted: this gate passed on every run while the script
# refused to start on actual Gentoo. Keep the quotes — they are the regression guard.
#
# NO `paths:` FILTER, deliberately. A required status check that does not run is not
# "skipped" to a ruleset — it stays PENDING, and the PR is blocked forever. With a
# paths filter this gate could not be required at all, which is the whole point of
# having it. Running an extra ~1 min container on a docs-only PR is the cheaper half
# of that trade.
name: bootstrap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # For packages-check ONLY, and it is the reason that job is worth having. A package
  # rename or drop upstream breaks this repo's list with NOBODY having edited the repo,
  # so a gate that fires only on pull_request cannot see the failure it exists to catch —
  # it would go red on the next unrelated PR, blaming a change that did not cause it.
  # Gentoo is the most rolling target in the fleet, which makes this the most useful here.
  schedule:
    - cron: "17 6 * * 5" # Fridays 06:17 UTC — off the hour, to dodge the runner rush

permissions:
  contents: read

jobs:
  test:
    uses: dotgibson/dotfiles-core/.github/workflows/bootstrap-test.yml@v5
    with:
      image: gentoo/stage3:latest
      prep: "grep -qE \"^ID='?gentoo\" /etc/os-release 2>/dev/null || echo \"ID='gentoo'\" >> /etc/os-release"
      # THE WEEKLY UNSTUBBED SWEEP NEEDS HOURS ON THIS IMAGE, and only on this image.
      # Read STATICALLY out of this block by dotfiles-core's scripts/fleet-bootstrap-matrix.py
      # to set timeout-minutes on the real-bootstrap leg; the two jobs BELOW are stubbed,
      # finish in ~20s, and deliberately keep their own tight ceilings. Do not wire this
      # into them.
      #
      # 240, from measurement rather than a guess. On the first-ever real-bootstrap run
      # (dotgibson/dotfiles-core#742) this leg was cancelled at the old flat 45m while still
      # MAKING FORWARD PROGRESS — `emerge --sync` alone took the first 2.5 minutes, 112
      # packages had completed, the binhost was active, and it was mid-emerge when killed,
      # not stalled. bootstrap.sh says as much in its own header: "emerge COMPILES", "a
      # single emerge can run for HOURS". The binhost covers many atoms but not all, and the
      # ones that fall through (rust-bin, zoxide, atuin, starship, lnav, tree-sitter) compile
      # locally for minutes each.
      #
      # GitHub's per-job ceiling is 360, so this keeps real headroom while still leaving a
      # genuine hang something to hit — the point of check-modern.sh's rule 8. If a future
      # run finishes far inside this, bring it down; if one is cancelled here, check the log
      # for a STALL before raising it, because a cancelled leg is not a hang by itself.
      bootstrap_timeout: 240
      # Run provision() for real, with package managers and downloaders replaced by
      # logging no-ops (dotgibson/dotfiles-core#575). --links-only returns BEFORE
      # provision() is entered, so package installation, retries, upstream installers,
      # repo/key setup and every failure path around them were executed by no gate
      # anywhere. A green run means provision() ran and RETURNED, and wire_links still
      # happened after it — not that provisioning works: nothing is really installed.
      provision_stub: true
      # Resolve every atom in install/packages.txt against the canonical package index,
      # downloading and emerging nothing. This is the blind spot provision_stub cannot
      # cover: it stubs the package managers, so a WRONG ATOM is invisible to it.
      #
      # A repo script rather than a one-liner, because Gentoo cannot do this in-container.
      # `gentoo/stage3:latest` ships NO PORTAGE TREE — verified in CI, where
      # `portageq best_visible /` failed to resolve `app-shells/zsh`, a package that plainly
      # exists. Acquiring a tree means `emerge-webrsync` (minutes, ~200k files), and `prep`
      # above is SHARED with links-only and provision-stub, which finish in ~20s and gain
      # nothing from it. The script asks packages.gentoo.org instead — no tree, no emerge,
      # ~37s for the whole list — and handles curl-or-wget because with no tree the
      # container cannot install a client either (wget is in Gentoo's system set; curl is
      # not). See scripts/pkg-resolve.sh for the full rationale and its exit contract.
      packages_check: ./scripts/pkg-resolve.sh
      # packages_file is left at its default (install/packages.txt) — this repo's list needs
      # no pre-filtering, unlike dotfiles-Debian's per-distro annotations.
