# .github/workflows/packages.yml
# Gate the package set against REAL Portage trees — install/packages.txt against
# ::gentoo, and the two atom lists bootstrap.sh hard-codes: guru_install against
# the GURU overlay, extras_install against ::gentoo.
#
# Not a reusable caller: this check is Gentoo-only by nature (no other repo in the
# fleet has atoms, keywords or a stable/testing split), so there is nothing to
# share upstream. The logic lives in scripts/check-packages.sh so it runs the same
# way locally — `make check-packages`.
#
# Cost: emerge-webrsync pulls a tree snapshot (~1-2 min) rather than emerge --sync,
# which is much slower and needs rsync mirrors; the GURU tarball adds ~14 MB.
#
# This one KEEPS its paths filter, unlike lint.yml and bootstrap.yml which dropped
# theirs so they could become required checks. The reasoning is the same rule read
# the other way: a filtered gate cannot be required (a check that never runs stays
# PENDING and blocks the PR forever), and this gate should not be required — it
# fetches a whole Portage tree, and it has nothing to say about a PR that does not
# touch the package set. Filtered and advisory is the right trade here; unfiltered
# and required is the right trade there.
name: packages

on:
  pull_request:
    paths:
      - 'install/packages.txt'
      - 'gentoo/package.accept_keywords'
      - 'scripts/check-packages.sh'
      # bootstrap.sh carries two atom lists — guru_install (checks 5-6) and the
      # opt-in extras_install (check 7). A phantom atom added to either is exactly
      # the bug this gate now catches, so a change to it has to trigger the gate —
      # otherwise the check that exists to catch it never runs on the commit that
      # introduces it.
      - 'bootstrap.sh'
      - '.github/workflows/packages.yml'
  push:
    branches: [main]
    paths:
      - 'install/packages.txt'
      - 'gentoo/package.accept_keywords'
      - 'scripts/check-packages.sh'
      - 'bootstrap.sh'
      # The workflow itself, same as in pull_request above — without it a
      # workflow-only change lands on main with no signal, which is the one commit
      # you most want checked.
      - '.github/workflows/packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atoms:
    name: atoms exist and install on stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: gentoo/stage3:latest@sha256:dff1d25c6f9066d835b2785fb524b88155d9b3071f1a9968930d70696ab4fdb8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A stage3 image ships no ::gentoo tree. webrsync fetches a snapshot tarball,
      # which is the fast path — `emerge --sync` would rsync the whole tree.
      - name: Fetch a Portage tree snapshot
        run: emerge-webrsync

      # Checks 5-6 read the GURU overlay, which no stage3 ships and which
      # `eselect repository enable guru` would pull in via a compile of
      # app-eselect/eselect-repository plus a full git sync. A snapshot tarball is
      # the same tree for a read-only existence check: ~14 MB, a couple of seconds,
      # and no git in the image. It is the mirror this repo's boxes already sync
      # from, so the answer here matches the answer on a provisioned machine.
      - name: Fetch the GURU overlay
        # Explicit bash: the default `sh -e {0}` only happens to work here because
        # Gentoo's /bin/sh is bash, and `set -o pipefail` is not POSIX.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /var/db/repos
          wget -qO /tmp/guru.tar.gz \
            https://github.com/gentoo-mirror/guru/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/guru.tar.gz -C /var/db/repos
          mv /var/db/repos/guru-master /var/db/repos/guru
          test -d /var/db/repos/guru/app-misc

      # --require-tree: without it the script SKIPS (exit 0) when it finds no synced
      # tree, which is right for a laptop and exactly wrong here — if
      # emerge-webrsync or the GURU fetch ever moves, changes, or half-succeeds,
      # this gate would go green having validated nothing. It now covers the GURU
      # overlay too, so a broken fetch above fails here rather than quietly
      # downgrading to "packages.txt only".
      - name: check-packages
        run: ./scripts/check-packages.sh --require-tree
        env:
          GURU_TREE: /var/db/repos/guru

      # THE BLIND SPOT check-packages.sh CANNOT COVER, and it is not a small one.
      # That script asks, per atom, "does this have a stable keyword, or a line in
      # gentoo/package.accept_keywords?" — a question about the atom ITSELF. It never
      # asks whether the atom RESOLVES. dev-util/shellcheck passed every check in it
      # for months while being flatly uninstallable, because its blocker was
      # >=dev-haskell/aeson-1.4.0: a masked DEPENDENCY, one level down and invisible
      # to a per-atom lookup. The bootstrap dutifully skipped it, printed a hint
      # naming the wrong atom, and exited 0 (issue #133).
      #
      # Only Portage's own resolver can answer that, so ask it. `emerge -p` resolves
      # the full graph and downloads nothing. It found a SECOND live instance of the
      # same class on its very first run: every app-editors/neovim 0.12.x needs
      # >=dev-lua/luv-1.52.1, which is ~arch on every arch, so the repo's neovim
      # keyword line had never been enough on its own. Checks 3 and 8 both passed on
      # it the whole time, because both are questions about neovim.
      #
      # RESOLVE AGAINST THE CONTAINER'S REAL ROOT — do NOT "improve" this by adding
      # `--root` into an empty directory to simulate a fresh box. A conditional USE
      # dependency (neovim's `${LUA_SINGLE_USEDEP}` on luv is the live example) cannot
      # be satisfied against an empty vdb, and Portage reports the resulting dead end
      # as a KEYWORD MASK on a package that is not masked at all. That false positive
      # cost an investigation once already; the container is a fresh box, so simulating
      # one inside it buys nothing.
      #
      # RENDER THE SHIPPED KEYWORD FILES FIRST. Resolving without them answers a
      # different question than the one a fresh box asks — it would report every
      # ~arch atom as broken, and it would not exercise the file whose whole job is
      # to make them installable.
      #
      # FATAL, as of this change. It landed advisory because a stage3 container's
      # profile and USE defaults are not identical to a provisioned box's, so a first
      # red was as likely to be a fixture artefact as a real regression. That doubt is
      # paid off: it has run clean on every invocation since it landed — including
      # twice on `main` after merge — reporting "resolving 42 atoms / every atom
      # resolves on a stable amd64 profile", matching what the same 42 atoms do
      # against a real Gentoo box's trees.
      #
      # AND ADVISORY WAS COSTING MORE THAN IT LOOKED. Warn-only, this step exits 0
      # whether it resolved everything or nothing, so a GREEN step and a WARNED step
      # are indistinguishable in the checks list — you have to open the log to know
      # which happened. That is the shape this repo's workflows keep warning about: a
      # gate that reads as coverage while asserting nothing. A warning nobody is
      # required to read is not a signal, and the reason this step exists at all is
      # that dev-util/shellcheck sat unresolvable for months behind green checks.
      #
      # If a stage3 quirk reds this later, the fix is to make the FIXTURE honest — not
      # to demote this back to a warning.
      - name: Resolve the whole set with Portage
        shell: bash
        run: |
          # -e is on: a failed sed or a missing portageq is a broken FIXTURE and must
          # not read as "resolved fine". Only the resolve itself is tolerant, and it
          # is tolerant by sitting in an `if` condition, which errexit exempts.
          set -euo pipefail
          arch="$(portageq envvar ARCH)"
          mkdir -p /etc/portage/package.accept_keywords /etc/portage/package.license /etc/portage/repos.conf
          sed "s/__ARCH__/$arch/g" gentoo/package.accept_keywords \
            >/etc/portage/package.accept_keywords/90-dotfiles-Gentoo
          sed "s/__ARCH__/$arch/g" gentoo/package.license \
            >/etc/portage/package.license/90-dotfiles-Gentoo
          # The GURU tarball is on disk but unknown to Portage without this; without
          # it app-arch/ouch would resolve as "no ebuilds", which is a fixture bug
          # reported as a packaging bug.
          printf '[guru]\nlocation = /var/db/repos/guru\n' >/etc/portage/repos.conf/guru.conf

          # packages.txt plus BOTH opt-in lists, read from bootstrap.sh's own calls
          # rather than retyped — the same rule check-packages.sh follows, for the
          # same reason. The unconditional guru_install set is deliberately excluded:
          # it is best-effort by design and a masked GURU atom there is not a defect.
          # `sed 's/[[:space:]]//g'`, NOT `tr -d '[:space:]'` — tr has no concept of
          # lines and eats the newlines too, collapsing the whole file into one
          # 40-atom-long string that Portage rejects as a single invalid atom.
          mapfile -t atoms < <(sed 's/#.*//; s/[[:space:]]//g' install/packages.txt | grep .)
          mapfile -t -O "${#atoms[@]}" atoms < <(
            grep -oE '^[[:space:]]*(guru_)?extras_install[[:space:]]+[a-z0-9-]+/[a-zA-Z0-9._-]+' bootstrap.sh \
              | awk '{print $2}'
          )
          echo "resolving ${#atoms[@]} atoms"

          if out="$(emerge -p --quiet "${atoms[@]}" 2>&1)"; then
            echo "every atom resolves on a stable $arch profile with the keyword files this repo ships"
          else
            echo "::error::Portage could not resolve the atom set — a MASKED DEPENDENCY is the usual cause, and no per-atom check in check-packages.sh can see one. Read which atom the 'have been masked' line quotes; it is often not the one you asked for."
            printf '%s\n' "$out" | tail -n 60
            exit 1
          fi
