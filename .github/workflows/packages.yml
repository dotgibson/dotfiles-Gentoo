# .github/workflows/packages.yml
# Gate the package set against REAL Portage trees — install/packages.txt against
# ::gentoo, and bootstrap.sh's guru_install list against the GURU overlay.
#
# Not a reusable caller: this check is Gentoo-only by nature (no other repo in the
# fleet has atoms, keywords or a stable/testing split), so there is nothing to
# share upstream. The logic lives in scripts/check-packages.sh so it runs the same
# way locally — `make check-packages`.
#
# Cost: emerge-webrsync pulls a tree snapshot (~1-2 min) rather than emerge --sync,
# which is much slower and needs rsync mirrors; the GURU tarball adds ~14 MB.
#
# This one KEEPS its paths filter, unlike lint.yml and bootstrap.yml which dropped
# theirs so they could become required checks. The reasoning is the same rule read
# the other way: a filtered gate cannot be required (a check that never runs stays
# PENDING and blocks the PR forever), and this gate should not be required — it
# fetches a whole Portage tree, and it has nothing to say about a PR that does not
# touch the package set. Filtered and advisory is the right trade here; unfiltered
# and required is the right trade there.
name: packages

on:
  pull_request:
    paths:
      - 'install/packages.txt'
      - 'gentoo/package.accept_keywords'
      - 'scripts/check-packages.sh'
      # bootstrap.sh carries the guru_install list, which checks 5-6 validate. A
      # phantom atom added there is exactly the bug this gate now catches, so a
      # change to it has to trigger the gate — otherwise the check that exists to
      # catch it never runs on the commit that introduces it.
      - 'bootstrap.sh'
      - '.github/workflows/packages.yml'
  push:
    branches: [main]
    paths:
      - 'install/packages.txt'
      - 'gentoo/package.accept_keywords'
      - 'scripts/check-packages.sh'
      - 'bootstrap.sh'
      # The workflow itself, same as in pull_request above — without it a
      # workflow-only change lands on main with no signal, which is the one commit
      # you most want checked.
      - '.github/workflows/packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atoms:
    name: atoms exist and install on stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: gentoo/stage3:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A stage3 image ships no ::gentoo tree. webrsync fetches a snapshot tarball,
      # which is the fast path — `emerge --sync` would rsync the whole tree.
      - name: Fetch a Portage tree snapshot
        run: emerge-webrsync

      # Checks 5-6 read the GURU overlay, which no stage3 ships and which
      # `eselect repository enable guru` would pull in via a compile of
      # app-eselect/eselect-repository plus a full git sync. A snapshot tarball is
      # the same tree for a read-only existence check: ~14 MB, a couple of seconds,
      # and no git in the image. It is the mirror this repo's boxes already sync
      # from, so the answer here matches the answer on a provisioned machine.
      - name: Fetch the GURU overlay
        run: |
          set -euo pipefail
          mkdir -p /var/db/repos
          wget -qO /tmp/guru.tar.gz \
            https://github.com/gentoo-mirror/guru/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/guru.tar.gz -C /var/db/repos
          mv /var/db/repos/guru-master /var/db/repos/guru
          test -d /var/db/repos/guru/app-misc

      # --require-tree: without it the script SKIPS (exit 0) when it finds no synced
      # tree, which is right for a laptop and exactly wrong here — if
      # emerge-webrsync or the GURU fetch ever moves, changes, or half-succeeds,
      # this gate would go green having validated nothing. It now covers the GURU
      # overlay too, so a broken fetch above fails here rather than quietly
      # downgrading to "packages.txt only".
      - name: check-packages
        run: ./scripts/check-packages.sh --require-tree
        env:
          GURU_TREE: /var/db/repos/guru
