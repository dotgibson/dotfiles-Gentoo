# dotfiles-Gentoo/gentoo/mise-tools.toml
# ──────────────────────────────────────────────────────────────────────────────
# The modern-CLI stack for a box where the operator CANNOT escalate: no sudo, no
# emerge, /etc/portage not writable. bootstrap.sh --user installs this to
#
#     ~/.config/mise/conf.d/10-dotfiles-Gentoo.toml
#
# mise pulls PREBUILT binaries (aqua/ubi backends, checksum- and where available
# GitHub-attestation-verified) into ~/.local/share/mise, so every tool here lands
# in $HOME with no privileges and no compiler.
#
# WHY conf.d AND NOT config.toml: ~/.config/mise/config.toml is Core's seed ADOPTED as
# a real, user-owned copy (core/lib/bootstrap-lib.sh :: blib_adopt) so that mise's own
# documented gesture, `mise use -g <tool>`, has somewhere safe to write — it was once a
# symlink into core/, and `mise use -g` then edited vendored Core. Re-installing THIS
# manifest into that file on every bootstrap would clobber the user's pins; mise merges
# every conf.d/*.toml alongside the global config, so a file this repo owns outright
# adds tools without touching the one the user owns.
#
# Scope: CLI tools only. Core's own config.toml keeps owning the language runtimes
# (node/python/go/rust/…) — this file is strictly what `emerge` would otherwise
# have provided.
#
# Coverage: 40 of core-doctor's 41 rows. The gaps and why:
#   procs, git-absorb   no registry entry -> cargo install (bootstrap does it)
#   sesh                no registry entry -> go install (bootstrap does it)
#   ouch                no registry entry, and `cargo install ouch` FAILS here:
#                       its unrar-ng-sys dep compiles vendored C++ with
#                       -stdlib=libc++, which a GCC/libstdc++ box does not have.
#                       Upstream ships musl binaries -> ubi backend, below.
#   zsh                 not in any registry; built from source (see bootstrap.sh)
[tools]
# ── modern CLI ───────────────────────────────────────────────────────────────
"ubi:ouch-org/ouch" = "latest"
eza = "latest"
bat = "latest"
fd = "latest"
ripgrep = "latest"
fzf = "latest"
zoxide = "latest"
delta = "latest"
dust = "latest"
duf = "latest"
btop = "latest"
yazi = "latest"
viddy = "latest"
tealdeer = "latest"      # provides `tldr`
# ── integrations ─────────────────────────────────────────────────────────────
starship = "latest"
atuin = "latest"
carapace = "latest"
gum = "latest"
# ── data / net ───────────────────────────────────────────────────────────────
jq = "latest"
yq = "latest"            # mikefarah's Go yq, per PORTING-MATRIX footnote 6
jnv = "latest"
gron = "latest"
sd = "latest"
xh = "latest"
doggo = "latest"
gping = "latest"
glow = "latest"
lnav = "latest"          # 0.14.x here — newer than ::gentoo's 0.11.2
op = "latest"            # 1Password CLI
# ── dev / repo ───────────────────────────────────────────────────────────────
"ast-grep" = "latest"
shellcheck = "latest"
shfmt = "latest"
hyperfine = "latest"
watchexec = "latest"
uv = "latest"
ty = "latest"            # Astral's Python type checker; Core caches its completion beside uv's
jj = "latest"
difftastic = "latest"    # provides `difft`
# ── editor + multiplexer + treesitter ────────────────────────────────────────
neovim = "latest"
tmux = "latest"
"tree-sitter" = "latest"
